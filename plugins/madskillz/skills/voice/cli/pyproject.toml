[project]
name = "voicectl"
version = "0.1.0"
description = "Owner-voice pipeline CLI: corpus capture, core+overlay render, pull/push sync with the user's voice store."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
voicectl = "voicectl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicectl"]

[dependency-groups]
dev = ["pytest>=8"]
